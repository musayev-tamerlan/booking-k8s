<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Full architecture diagram</title><style>
*{box-sizing:border-box}body{margin:0;background:#090f19;color:#edf4ff;font:15px/1.5 system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding:18px 24px;border-bottom:1px solid #2c3e56}a{color:#72c7ff}nav{display:flex;gap:20px}nav a{text-decoration:none}nav a[aria-current]{color:white;border-bottom:2px solid #72c7ff}h1{font-size:21px;margin:0}p{margin:8px 24px;color:#9badc5;font-size:12px}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 24px}button,.download{border:1px solid #405977;background:#15283e;border-radius:6px;color:white;padding:8px 13px;font:inherit;cursor:pointer;text-decoration:none}.download{margin-left:auto}button:disabled{opacity:.4}button:focus-visible,a:focus-visible{outline:3px solid #ffd276;outline-offset:4px}#viewer{margin:0 16px 16px;height:calc(100dvh - 200px);min-height:300px;overflow:auto;border:1px solid #2c3e56;background:#050a12;touch-action:pan-x pan-y;cursor:grab}#viewer.dragging{cursor:grabbing}#diagram{display:block;width:100%;max-width:none;height:auto;user-select:none}#zoomLabel{min-width:52px;text-align:center}@media(max-width:650px){header{padding:12px 16px}.tools{padding:12px 16px;gap:7px}h1{font-size:17px}.download{margin-left:0}#viewer{height:65dvh}}
</style></head><body><header><h1>Global booking system</h1><nav aria-label="Presentation views"><a href="index.html">Request journey</a><a href="diagram.html" aria-current="page">Full diagram</a></nav></header><p>Previously generated educational illustration. Not a verified architecture of Booking.com. Small labels are part of the original image.</p><div class="tools"><button id="out" aria-label="Zoom out">−</button><output id="zoomLabel" aria-live="polite">100%</output><button id="in" aria-label="Zoom in">+</button><button id="fit">Fit width</button><a class="download" href="assets/production-architecture.png" download="booking-architecture.png">Download PNG ↓</a></div><div id="viewer" tabindex="0" role="region" aria-label="Architecture diagram. Use zoom buttons and scroll, or drag to pan."><img id="diagram" src="assets/production-architecture.png" alt="Generated global booking architecture: two regions with Kubernetes clusters, load balancers, API Gateway replicas, booking, hotels and payment services, PostgreSQL primary and replicas, observability and failure recovery." draggable="false"></div><script>
const viewer=document.getElementById('viewer'),img=document.getElementById('diagram');let zoom=1,drag=null;function applyZoom(next){const old=zoom;zoom=Math.max(1,Math.min(4,next));const cx=viewer.scrollLeft+viewer.clientWidth/2,cy=viewer.scrollTop+viewer.clientHeight/2;img.style.width=(zoom*100)+'%';viewer.scrollLeft=cx*zoom/old-viewer.clientWidth/2;viewer.scrollTop=cy*zoom/old-viewer.clientHeight/2;document.getElementById('zoomLabel').textContent=Math.round(zoom*100)+'%';document.getElementById('out').disabled=zoom===1;document.getElementById('in').disabled=zoom===4}document.getElementById('in').onclick=()=>applyZoom(zoom+.5);document.getElementById('out').onclick=()=>applyZoom(zoom-.5);document.getElementById('fit').onclick=()=>{applyZoom(1);viewer.scrollTo(0,0)};viewer.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;drag={x:e.clientX,y:e.clientY,left:viewer.scrollLeft,top:viewer.scrollTop};viewer.setPointerCapture(e.pointerId);viewer.classList.add('dragging')});viewer.addEventListener('pointermove',e=>{if(drag){viewer.scrollLeft=drag.left+drag.x-e.clientX;viewer.scrollTop=drag.top+drag.y-e.clientY}});function end(){drag=null;viewer.classList.remove('dragging')}viewer.addEventListener('pointerup',end);viewer.addEventListener('pointercancel',end);applyZoom(1);
</script></body></html>
