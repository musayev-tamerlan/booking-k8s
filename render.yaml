services:
  - type: web
    name: booking-k8s-presentation
    runtime: static
    buildCommand: echo "Static presentation is ready"
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
